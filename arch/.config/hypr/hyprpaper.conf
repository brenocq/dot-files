# hyprpaper 0.8+ config.
#
# The old `preload = <path>` / `wallpaper = ,<path>` lines are legacy syntax:
# wallpapers are now `wallpaper { ... }` blocks and images are loaded on demand.
#
# No wallpaper block here on purpose. ~/.config/hypr/scripts/wallpaper.sh
# (started from hyprland.conf) picks a random image from ~/Pictures/wallpapers
# and applies it to every monitor over IPC once hyprpaper is up.

# Enable hyprctl to control hyprpaper
ipc = on
